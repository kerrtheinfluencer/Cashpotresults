name: Build Yaad Adz Android app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'yaadadz-android/**'
      - '.github/workflows/build-yaadadz-android.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: yaadadz-android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Restore signing key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_PW" ]; then
            echo "::error::Missing secrets ANDROID_KEYSTORE_BASE64 and/or ANDROID_KEYSTORE_PASSWORD (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/yaadadz.keystore"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/yaadadz.keystore" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$KS_PW" >> "$GITHUB_ENV"
          echo "VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Build signed APK and AAB
        run: gradle --no-daemon assembleRelease bundleRelease

      - name: Rename outputs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/YaadAdz.apk
          cp app/build/outputs/bundle/release/app-release.aab dist/YaadAdz.aab

      - uses: actions/upload-artifact@v4
        with:
          name: YaadAdz-android
          path: yaadadz-android/dist/*

      - name: Publish release (direct APK download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: yaadadz-build-${{ github.run_number }}
          name: Yaad Adz Android build ${{ github.run_number }}
          files: |
            yaadadz-android/dist/YaadAdz.apk
            yaadadz-android/dist/YaadAdz.aab
